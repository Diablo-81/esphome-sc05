esphome:
  name: sensore-aria-cap-4
  friendly_name: Sensore Aria Capannone 4

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: ../components

uart:
  id: uart_sc05
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: NONE

sensor:
  - platform: sc05
    uart_id: uart_sc05
    communication_timeout: 3s

    nh3:
      name: "Capannone-4 NH3"

    full_scale:
      name: "Capannone-4 SC05 Full Scale"

    crc_errors:
      name: "Capannone-4 SC05 CRC Errors"

    lost_frames:
      name: "Capannone-4 SC05 Lost Frames"

    invalid_frame_counter:
      name: "Capannone-4 SC05 Invalid Frames"

    timeout_counter:
      name: "Capannone-4 SC05 Timeout Counter"

    last_frame_age:
      name: "Capannone-4 SC05 Last Frame Age"

    online:
      name: "Capannone-4 SC05 Online"

    status:
      name: "Capannone-4 SC05 Stato"
